[project]
name = "tactile-flora"
version = "0.1.0"
description = "Fingertip-force channel for FLORA-Rewarder: data, prompts, LoRA SFT, evaluation, Baxter capture."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
    "rich",
    "av>=15,<16",
    "pillow>=13.0.0",
    "zarr>=3.1.6",
    "h5py>=3.16.0",
    "tokenizers>=0.23.3",
]

[project.optional-dependencies]
train = ["torch", "transformers", "peft", "accelerate", "tokenizers"]
baxter = ["pyserial", "rospkg"]
dev = ["pytest", "ruff", "pyright", "wandb", "pandas-stubs", "types-pyyaml"]

[project.scripts]
tf = "tactile_flora.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tactile_flora"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213", "D107", "D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["tactile_flora", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
