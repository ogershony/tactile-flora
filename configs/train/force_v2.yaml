# force_v2 (2026-10-22): force.yaml with 3 epochs and dense_failure_weight 3.58. The v1 reward model
# (1 epoch, 29 updates, unweighted) predicted all-normal on reassemble_test (failure recall 0.04);
# train.parquet holds 279 all-normal and 78 non-normal dense windows, 279 / 78 = 3.58.
manifest: data/manifest/train.parquet
base_model: nvidia/Flora-Rewarder
force_mode: real
seed: 0
epochs: 3
learning_rate: 1.0e-4
warmup_frac: 0.03
grad_clip: 1.0
effective_batch: 16
lora:
  rank: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
output_dir: data/runs
dense_failure_weight: 3.58
