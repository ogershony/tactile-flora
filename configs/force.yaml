resample:
  half_window_s: 0.125
  frame_period_s: 0.25
  group_period_s: 0.5
  raw_rate_hz: 100.0
  contact_sigma: 3.0
render:
  header: "Force (normalized: 0 free space, 1 median grasp, max 3):"
  decimals: 2
  # Spec asked for 1,500, but with the Qwen3 tokenizer the exact spec line format costs
  # 40 tokens per one-arm pad line and 68 per two-arm line (64 lines: 2,560 / 4,352).
  # 2,800 covers every single-arm window; two-arm windows need a format decision (see README).
  max_tokens: 2800
  clip_max: 3.0
events:
  grasp_g: 0.6
  grasp_f: 0.5
  grasp_window_s: 0.5
  slip_df: -2.0
  slip_min_s: 0.1
  slip_g_tol: 0.02
  contact_loss_s: 0.3
  regrasp_window_s: 3.0
  crush_f: 2.0
  off_axis_delta: 0.6
