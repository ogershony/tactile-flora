resample:
  half_window_s: 0.125
  frame_period_s: 0.25
  group_period_s: 0.5
  raw_rate_hz: 100.0
  contact_sigma: 3.0
render:
  header: "Force (normalized: 0 free space, 1 median grasp, max 3):"
  decimals: 2
  # Spec asked for 1,500, but with the Qwen3 tokenizer the exact spec line format costs
  # 40 tokens per one-arm pad line, 34 per one-arm wrist line and 68 per two-arm pad line.
  # 3000 admits every single-arm window: 64 one-arm pad lines = 2,560 real / ~2,740 with the
  # 0.75 tokens/char fallback. Two-arm windows (4,352) are rejected; see docs/deviations.md.
  max_tokens: 3000
  # Real runs set this to the Qwen3.5 tokenizer.json path so budget checks use the real count.
  tokenizer_json: null
  clip_max: 3.0
events:
  grasp_g: 0.6
  grasp_f: 0.5
  grasp_window_s: 0.5
  slip_df: -2.0
  slip_min_s: 0.1
  slip_g_tol: 0.02
  contact_loss_s: 0.3
  regrasp_window_s: 3.0
  crush_f: 2.0
  off_axis_delta: 0.6
