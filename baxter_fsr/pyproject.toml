[project]
name = "baxter-fsr"
version = "0.1.0"
description = "Baxter FSR fingertips: ESP32 firmware, serial/UDP drivers, calibration, ROS 1 node and recorder."
readme = "README.md"
# 3.11: Noetic's rospy and roslib still import modules removed in Python 3.12.
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "typer",
    "rich",
    "av>=15,<16",
    "pyserial",
    "rospkg",
]

[project.scripts]
tf = "tactile_flora.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tactile_flora"]
