# ESP32 boards over WiFi (tactile_flora/baxter/firmware/esp32_fsr); /dev/ttyUSB0 for a HUZZAH32 on
# USB (CP2104), /dev/ttyACM0 for the Teensy. `tf baxter monitor --port` overrides it for bring-up.
serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_02E4CAE2-if00-port0
baud: 921600              # HUZZAH32 UART; the Teensy ignores it (USB CDC)
sample_rate_hz: 200.0
r_ref_ohm: 5100.0          # as built on the first board (2026-10-23); Step 3 may change it
channels: [L_a, L_b, R_a, R_b]
clock_refit_s: 5.0
calibration_path: configs/baxter_calibration.json
camera_fps: 30.0
output_dir: data/raw/baxter
topics:
  raw: /tactile/raw
  force: /tactile/force
  health: /tactile/health
  cameras:
    scene: /cameras/head_camera/image
    wrist_left: /cameras/left_hand_camera/image
    wrist_right: /cameras/right_hand_camera/image
  gripper_state:
    L: /robot/end_effector/left_gripper/state
    R: /robot/end_effector/right_gripper/state
  policy_status: /policy/status
  zero: /tactile/zero
# UNCONFIRMED: set sensor_confirmed true only after the sensor (ASIN B0FGD267GK, 0.4 mm film rated
# 20 g-2 kg, listing photos show an RP-C10-ST style part) has its R(F) measured and r_ref_ohm /
# the calibration are redone for it. The node and calibrate CLI warn while false.
sensor_confirmed: false
adc_max_counts: 4095
saturation_counts: 4090      # UNCONFIRMED: sensor-dependent
saturation_frac_max: 0.05
# Pre-start flat check OFF (2026-10-24): an unloaded pad sits flat at the ESP32's ~0.15 V floor
# and a slot without a board reads 0, so any positive value refused every episode. Set 0.25
# (counts^2 over 1 s) to turn it back on.
flat_variance: 0.0
health_period_s: 1.0
health_max_age_s: 3.0
gripper_open_max: 0.1        # closure 0 open .. 1 closed
# tf baxter calibrate: one pad at a time pushed against a kitchen scale (firmware/esp32_fsr/README.md)
calibration_samples: 200     # 1 s of samples per push, median taken
calibration_min_points: 4    # usable pushes per pad besides the unloaded reading
linear_max_counts: 3000      # ESP32 ADC linear to ~2.45 V; points above it are flagged
